<div class="tooltips cmd cmd-widget" data-type="info" data-subtype="string" data-cmd_id="#id#" data-cmd_uid="#uid#" data-version="#version#" data-eqLogic_id="#eqLogic_id#" style="display: block;">
	<div class="content-xs">
		<span class="cmdName #hide_name#">#name_display# </span> 
		<br/>
		<img class="state" src="" alt="Condition actuelle" />
	</div>
	<script>
		jeedom.cmd.update['#id#'] = function(_options) {
			var cmd = document.querySelector('.cmd[data-cmd_id="#id#"]');
			if (!cmd) return;
			cmd.title = 'Valeur du ' + _options.valueDate + ', collectée le ' + _options.collectDate;
			var value = _options.display_value;
			var img = cmd.querySelector('.state');
			if (img) img.src = value.replace('.png', '-big.png');
		}
		jeedom.cmd.update['#id#']({display_value: '#state#', valueDate: '#valueDate#', collectDate: '#collectDate#', alertLevel: '#alertLevel#'});
	</script>
</div>
