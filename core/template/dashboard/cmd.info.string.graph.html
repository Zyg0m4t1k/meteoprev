<div class="cmd cmd-widget" data-type="info" data-subtype="string" data-cmd_id="#id#" data-cmd_uid="#uid#" data-version="#version#" data-eqLogic_id="#eqLogic_id#" >
	<script src="plugins/meteoprev/desktop/js/dashboard.js"></script>
	<div class="title #hide_name#">
		<div class="cmdName">#name_display#</div>
	</div>
	<center style="margin-top: 5px;">
		<div id="mpv_days_#id#" >
			<div id="days_#id#">
			</div>
		</div>		
		<div class="mpv_graph_#id#" id="mpv_container_#id#" style="width: 500px;height: 210px;">
		</div>
	</center>	
	<script>
		jeedom.cmd.update['#id#'] = function(_options) {
			var cmd = document.querySelector('.cmd[data-cmd_id="#id#"]');
			var el = document.querySelector('.cmd[data-eqLogic_id="#eqLogic_id#"] #mpv_graph_#id#');
			var idDays = document.querySelector('.cmd[data-eqLogic_id="#eqLogic_id#"] #days_#id#');
			if (!cmd || !el) return;
			var id = cmd.dataset.eqlogic_id;
			domUtils.ajax({
				type: 'POST',
				url: 'plugins/meteoprev/core/ajax/meteoprev.ajax.php',
				data: {
					action: 'getStation',
					id: id
				},
				dataType: 'json',
				global: false,
				error: function(request, status, error) {
					handleAjaxError(request, status, error);
				},
				success: function(data) {
					if (data.state != 'ok') {
						jeedomUtils.showAlert({message: data.result, level: 'danger'});
						return;
					}
					if (data.result.state == 'ok') {
						if (idDays) {
							idDays.innerHTML = '';
							idDays.html(data.result.html);
						}
						var cmdWidget = document.querySelector('.cmd[data-cmd_uid="#uid#"]');
						if (cmdWidget) {
							cmdWidget.addEventListener('click', function(event) {
								var target = event.target.closest('.day_choose');
								if (target) {
									meteoprevGraph(id, target.dataset.count, 'mpv_container_#id#', 195);
								}
							});
						}
						meteoprevGraph(id, 0, 'mpv_container_#id#', 195);
					} else {
						el.innerHTML = 'Une erreur est survenue dans la récupération des informations';
					}
				}
			});
		}
		jeedom.cmd.update['#id#']({display_value: '#state#', valueDate: '#valueDate#', collectDate: '#collectDate#', alertLevel: '#alertLevel#'});
	</script>
	<style>
		.cmd[data-cmd_uid="#uid#"] #mpv_days_#id# {
			position: absolute;
			z-index: 1;
		}
	</style>
</div>
